<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TraderPro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131A24"/>
      <stop offset="1" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00C853"/>
      <stop offset="1" stop-color="#00E676"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="#00E676" stroke-opacity="0.35" stroke-width="4"/>

  <g filter="url(#glow)">
    <path d="M96 340 L176 268 L248 312 L336 176 L416 128"
          fill="none" stroke="url(#up)" stroke-width="22"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g stroke="#00E676" stroke-width="10" stroke-linecap="round">
    <line x1="176" y1="236" x2="176" y2="300"/>
    <line x1="336" y1="144" x2="336" y2="208"/>
  </g>
  <rect x="160" y="252" width="32" height="56" rx="7" fill="#00E676"/>
  <rect x="320" y="160" width="32" height="56" rx="7" fill="#00E676"/>

  <g stroke="#FF3B30" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="288" x2="256" y2="356"/>
  </g>
  <rect x="240" y="300" width="32" height="48" rx="7" fill="#FF3B30" opacity="0.9"/>

  <text x="256" y="438" text-anchor="middle"
        font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif"
        font-size="78" font-weight="700" letter-spacing="6" fill="#EAF2FF">TP</text>
</svg>
